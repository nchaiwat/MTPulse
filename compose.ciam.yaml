# Use only after DNS/TLS and local emergency admin are ready.
# docker compose --env-file .env.server -f compose.server.yaml -f compose.ciam.yaml ...
services:
  api:
    environment:
      MTPULSE_AUTH_MODE: ciam
      MTPULSE_AUDIT_PROXY_HOST: web
      MTPULSE_CORS_ORIGINS: '["https://wa-mtpulse.wa.net"]'
  worker:
    environment:
      MTPULSE_AUTH_MODE: ciam
  web:
    ports:
      - "443:443"
    volumes:
      - ./deploy/nginx.ciam.conf:/etc/nginx/conf.d/default.conf:ro
      - ./certificates:/etc/nginx/tls:ro

  ciam-agent:
    build: ./backend
    restart: unless-stopped
    command: ["python", "-m", "app.ciam_agent"]
    environment:
      MTPULSE_DATABASE_URL: postgresql+psycopg://mtpulse:${POSTGRES_PASSWORD}@db:5432/mtpulse
      MTPULSE_SETTINGS_ENCRYPTION_KEY: ${MTPULSE_SETTINGS_ENCRYPTION_KEY:?required}
      MTPULSE_AUTH_MODE: ciam
    depends_on:
      api:
        condition: service_healthy
