services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    command: ["postgres", "-c", "shared_preload_libraries=pg_stat_statements", "-c", "compute_query_id=on"]
    environment:
      POSTGRES_DB: mtpulse
      POSTGRES_USER: mtpulse
      POSTGRES_PASSWORD: mtpulse
    ports: ["5432:5432"]
    volumes: ["mtpulse-postgres:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mtpulse -d mtpulse"]
      interval: 5s
      timeout: 5s
      retries: 10
  api:
    build: ./backend
    restart: unless-stopped
    environment:
      MTPULSE_DATABASE_URL: postgresql+psycopg://mtpulse:mtpulse@db:5432/mtpulse
      MTPULSE_CORS_ORIGINS: '["http://localhost:5173"]'
      MTPULSE_SETTINGS_ENCRYPTION_KEY: ${MTPULSE_SETTINGS_ENCRYPTION_KEY:-}
      MTPULSE_ALLOW_SECRET_REVEAL: ${MTPULSE_ALLOW_SECRET_REVEAL:-false}
    ports: ["8000:8000"]
    depends_on:
      db:
        condition: service_healthy
  worker:
    build: ./backend
    restart: unless-stopped
    command: ["python", "-m", "app.worker"]
    environment:
      MTPULSE_DATABASE_URL: postgresql+psycopg://mtpulse:mtpulse@db:5432/mtpulse
      MTPULSE_SETTINGS_ENCRYPTION_KEY: ${MTPULSE_SETTINGS_ENCRYPTION_KEY:-}
      MTPULSE_WORKER_POLL_SECONDS: ${MTPULSE_WORKER_POLL_SECONDS:-30}
    depends_on:
      db:
        condition: service_healthy
volumes:
  mtpulse-postgres:
